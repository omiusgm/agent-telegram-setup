<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<title>Процесс жив ≠ polling авторизован</title>
<desc>Учебная иллюстрация. Условные данные. Не снимок личного аккаунта и не доказательство подключения.</desc>
<style>text{font-family:Arial,"DejaVu Sans",sans-serif} .mono{font-family:Menlo,"DejaVu Sans Mono",monospace}</style>
<rect x="0" y="0" width="1200" height="800" rx="0" fill="#eef3f7" stroke="none"/>
<rect x="24" y="24" width="1152" height="752" rx="22" fill="#ffffff" stroke="none"/>
<rect x="24" y="24" width="1152" height="110" rx="22" fill="#183047" stroke="none"/>
<rect x="24" y="105" width="1152" height="29" rx="0" fill="#183047" stroke="none"/>
<text x="52" y="56" font-size="14" fill="#b5d0e4" font-weight="700">АГЕНТ ЁЖ  /  TELEGRAM MCP → DOT</text>
<text x="52" y="96" font-size="30" fill="#ffffff" font-weight="700">Процесс жив ≠ polling авторизован</text>
<text x="52" y="165" font-size="19" fill="#5f7385" font-weight="400">Пример критериев проверки. Названия полей зависят от версии tunnel-client.</text>
<rect x="1038" y="44" width="108" height="34" rx="17" fill="#34556f" stroke="none"/>
<text x="1052" y="67" font-size="15" fill="#ffffff" font-weight="700">ШАГ 4</text>
<line x1="52" y1="722" x2="1148" y2="722" stroke="#dce6ed" stroke-width="2"/>
<text x="52" y="751" font-size="17" fill="#5f7385" font-weight="400">Учебная иллюстрация • условные данные • не снимок вашего аккаунта</text>
<rect x="52" y="210" width="524" height="416" rx="14" fill="#fff3ef" stroke="#efd3cc"/>
<text x="76" y="254" font-size="27" fill="#ad4d43" font-weight="700">Этого недостаточно</text>
<text x="76" y="310" font-size="23" fill="#213b51" font-weight="400">Процесс запущен</text>
<text x="76" y="361" font-size="23" fill="#213b51" font-weight="400">Health / ready отвечают</text>
<text x="76" y="412" font-size="23" fill="#213b51" font-weight="400">Polling получает 401 или 403</text>
<rect x="76" y="506" width="230" height="34" rx="17" fill="#f8dcd5" stroke="none"/>
<text x="90" y="529" font-size="15" fill="#ad4d43" font-weight="700">ЭТАП НЕ ПРОЙДЕН</text>
<rect x="604" y="210" width="544" height="416" rx="14" fill="#ecf8f1" stroke="#cae7d7"/>
<text x="628" y="254" font-size="27" fill="#247d5e" font-weight="700">Нужны подтверждения</text>
<text x="628" y="310" font-size="21" fill="#213b51" font-weight="400">Свежий успешный authenticated poll</text>
<text x="628" y="361" font-size="21" fill="#213b51" font-weight="400">Правильный TUNNEL_ID</text>
<text x="628" y="412" font-size="21" fill="#213b51" font-weight="400">Нет текущих ошибок авторизации</text>
<text x="628" y="463" font-size="21" fill="#213b51" font-weight="400">MCP upstream доступен</text>
<rect x="628" y="550" width="305" height="34" rx="17" fill="#d1ebdc" stroke="none"/>
<text x="642" y="573" font-size="15" fill="#247d5e" font-weight="700">МАРШРУТ ГОТОВ К ТЕСТУ</text>
<rect x="52" y="646" width="1096" height="56" rx="14" fill="#edf6fc" stroke="none"/>
<text x="70" y="675" font-size="18" fill="#167fc5" font-weight="400">Следующий этап — установка плагина и реальный вызов Dot. Они проверяются отдельно.</text>
</svg>
