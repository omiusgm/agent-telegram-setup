<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<title>Локальный мастер: Telegram и права</title>
<desc>Учебная иллюстрация. Условные данные. Не снимок личного аккаунта и не доказательство подключения.</desc>
<style>text{font-family:Arial,"DejaVu Sans",sans-serif} .mono{font-family:Menlo,"DejaVu Sans Mono",monospace}</style>
<rect x="0" y="0" width="1200" height="800" rx="0" fill="#eef3f7" stroke="none"/>
<rect x="24" y="24" width="1152" height="752" rx="22" fill="#ffffff" stroke="none"/>
<rect x="24" y="24" width="1152" height="110" rx="22" fill="#183047" stroke="none"/>
<rect x="24" y="105" width="1152" height="29" rx="0" fill="#183047" stroke="none"/>
<text x="52" y="56" font-size="14" fill="#b5d0e4" font-weight="700">АГЕНТ ЁЖ  /  TELEGRAM MCP → DOT</text>
<text x="52" y="96" font-size="30" fill="#ffffff" font-weight="700">Локальный мастер: Telegram и права</text>
<text x="52" y="165" font-size="19" fill="#5f7385" font-weight="400">Учебная схема Telegram-шага общего setup; не новый независимый интерфейс.</text>
<rect x="1038" y="44" width="108" height="34" rx="17" fill="#34556f" stroke="none"/>
<text x="1052" y="67" font-size="15" fill="#ffffff" font-weight="700">ШАГ 1</text>
<line x1="52" y1="722" x2="1148" y2="722" stroke="#dce6ed" stroke-width="2"/>
<text x="52" y="751" font-size="17" fill="#5f7385" font-weight="400">Учебная иллюстрация • условные данные • не снимок вашего аккаунта</text>
<rect x="52" y="198" width="1096" height="480" rx="14" fill="#f6f9fc" stroke="#dce7ef"/>
<rect x="52" y="198" width="1096" height="44" rx="14" fill="#e5edf4" stroke="none"/>
<text x="74" y="227" font-size="17" fill="#5f7385" font-weight="400">127.0.0.1:PORT  •  приватный мастер владельца</text>
<text x="78" y="286" font-size="28" fill="#213b51" font-weight="700">Что разрешить агенту?</text>
<rect x="78" y="311" width="28" height="28" rx="5" fill="#167fc5" stroke="none"/>
<text x="84" y="332" font-size="21" fill="#ffffff" font-weight="400">✓</text>
<text x="122" y="334" font-size="23" fill="#213b51" font-weight="400">Читать разрешённые чаты и контакты</text>
<rect x="78" y="365" width="28" height="28" rx="5" fill="#ffffff" stroke="#a9bfce"/>
<text x="122" y="388" font-size="23" fill="#213b51" font-weight="400">Текст в «Избранное» — отдельный тест</text>
<text x="122" y="419" font-size="18" fill="#5f7385" font-weight="400">Набор действий и область чатов выбираются независимо.</text>
<rect x="78" y="450" width="1044" height="84" rx="14" fill="#eaf7f0" stroke="none"/>
<text x="96" y="479" font-size="18" fill="#247d5e" font-weight="400">Если сессия уже работает — проверить и использовать её.</text>
<text x="96" y="507" font-size="18" fill="#247d5e" font-weight="400">Новый вход: QR из «Устройства» или телефон/код, затем 2FA.</text>
<rect x="78" y="574" width="258" height="48" rx="10" fill="#167fc5" stroke="none"/>
<text x="95" y="605" font-size="19" fill="#ffffff" font-weight="700">Проверить Telegram</text>
<text x="364" y="606" font-size="19" fill="#5f7385" font-weight="400">Ключи и пароль вводятся локально, не в чат.</text>
</svg>
