<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<title>ChatGPT Plugins: создать и установить</title>
<desc>Учебная иллюстрация. Условные данные. Не снимок личного аккаунта и не доказательство подключения.</desc>
<style>text{font-family:Arial,"DejaVu Sans",sans-serif} .mono{font-family:Menlo,"DejaVu Sans Mono",monospace}</style>
<rect x="0" y="0" width="1200" height="800" rx="0" fill="#eef3f7" stroke="none"/>
<rect x="24" y="24" width="1152" height="752" rx="22" fill="#ffffff" stroke="none"/>
<rect x="24" y="24" width="1152" height="110" rx="22" fill="#183047" stroke="none"/>
<rect x="24" y="105" width="1152" height="29" rx="0" fill="#183047" stroke="none"/>
<text x="52" y="56" font-size="14" fill="#b5d0e4" font-weight="700">АГЕНТ ЁЖ  /  TELEGRAM MCP → DOT</text>
<text x="52" y="96" font-size="30" fill="#ffffff" font-weight="700">ChatGPT Plugins: создать и установить</text>
<text x="52" y="165" font-size="19" fill="#5f7385" font-weight="400">Личная интеграция • Connection: Tunnel • тот же идентификатор туннеля.</text>
<rect x="1038" y="44" width="108" height="34" rx="17" fill="#34556f" stroke="none"/>
<text x="1052" y="67" font-size="15" fill="#ffffff" font-weight="700">ШАГ 5</text>
<line x1="52" y1="722" x2="1148" y2="722" stroke="#dce6ed" stroke-width="2"/>
<text x="52" y="751" font-size="17" fill="#5f7385" font-weight="400">Учебная иллюстрация • условные данные • не снимок вашего аккаунта</text>
<rect x="52" y="198" width="748" height="493" rx="14" fill="#f7fafc" stroke="#dce7ef"/>
<text x="76" y="235" font-size="24" fill="#213b51" font-weight="700">Add custom MCP server</text>
<text x="76" y="274" font-size="17" fill="#5f7385" font-weight="400">Name</text>
<rect x="76" y="287" width="700" height="52" rx="10" fill="#ffffff" stroke="#cddce7"/>
<text x="92" y="321" font-size="21" fill="#213b51" font-weight="400">Мой Telegram</text>
<text x="76" y="358" font-size="17" fill="#5f7385" font-weight="400">Connection</text>
<rect x="76" y="371" width="700" height="52" rx="10" fill="#ffffff" stroke="#cddce7"/>
<text x="92" y="405" font-size="21" fill="#213b51" font-weight="400">Tunnel  →  TUNNEL_ID</text>
<text x="76" y="442" font-size="17" fill="#5f7385" font-weight="400">Authentication для нашего stdio upstream</text>
<rect x="76" y="455" width="700" height="52" rx="10" fill="#ffffff" stroke="#cddce7"/>
<text x="92" y="489" font-size="21" fill="#213b51" font-weight="400">No authentication *</text>
<rect x="76" y="555" width="276" height="48" rx="10" fill="#167fc5" stroke="none"/>
<text x="93" y="586" font-size="19" fill="#ffffff" font-weight="700">Create as a plugin</text>
<line x1="367" y1="579" x2="422" y2="579" stroke="#167fc5" stroke-width="3"/>
<polyline points="414,573 422,579 414,585" fill="none" stroke="#167fc5" stroke-width="3"/>
<rect x="438" y="555" width="238" height="48" rx="10" fill="#247d5e" stroke="none"/>
<text x="455" y="586" font-size="19" fill="#ffffff" font-weight="700">Установить (+)</text>
<rect x="827" y="228" width="321" height="196" rx="14" fill="#edf6fc" stroke="none"/>
<text x="845" y="257" font-size="18" fill="#167fc5" font-weight="400">* Только для нашего</text>
<text x="845" y="285" font-size="18" fill="#167fc5" font-weight="400">private stdio через</text>
<text x="845" y="313" font-size="18" fill="#167fc5" font-weight="400">защищённый туннель.</text>
<text x="845" y="341" font-size="18" fill="#167fc5" font-weight="400"></text>
<text x="845" y="369" font-size="18" fill="#167fc5" font-weight="400">Вход runtime в OpenAI</text>
<text x="845" y="397" font-size="18" fill="#167fc5" font-weight="400">остаётся обязательным.</text>
<rect x="827" y="475" width="321" height="112" rx="14" fill="#fff6df" stroke="none"/>
<text x="845" y="504" font-size="18" fill="#8a650b" font-weight="400">Это не инструкция</text>
<text x="845" y="532" font-size="18" fill="#8a650b" font-weight="400">отключить авторизацию</text>
<text x="845" y="560" font-size="18" fill="#8a650b" font-weight="400">публичного HTTP MCP.</text>
<text x="76" y="657" font-size="19" fill="#5f7385" font-weight="400">Созданная карточка ещё не означает установленный плагин.</text>
</svg>
