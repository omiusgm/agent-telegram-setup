<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<title>Опционально: один текст в «Избранное»</title>
<desc>Учебная иллюстрация. Условные данные. Не снимок личного аккаунта и не доказательство подключения.</desc>
<style>text{font-family:Arial,"DejaVu Sans",sans-serif} .mono{font-family:Menlo,"DejaVu Sans Mono",monospace}</style>
<rect x="0" y="0" width="1200" height="800" rx="0" fill="#eef3f7" stroke="none"/>
<rect x="24" y="24" width="1152" height="752" rx="22" fill="#ffffff" stroke="none"/>
<rect x="24" y="24" width="1152" height="110" rx="22" fill="#183047" stroke="none"/>
<rect x="24" y="105" width="1152" height="29" rx="0" fill="#183047" stroke="none"/>
<text x="52" y="56" font-size="14" fill="#b5d0e4" font-weight="700">АГЕНТ ЁЖ  /  TELEGRAM MCP → DOT</text>
<text x="52" y="96" font-size="30" fill="#ffffff" font-weight="700">Опционально: один текст в «Избранное»</text>
<text x="52" y="165" font-size="19" fill="#5f7385" font-weight="400">Только по поручению и с подтверждением владельца. Другие получатели не открываются.</text>
<rect x="1038" y="44" width="108" height="34" rx="17" fill="#34556f" stroke="none"/>
<text x="1052" y="67" font-size="15" fill="#ffffff" font-weight="700">ШАГ 7</text>
<line x1="52" y1="722" x2="1148" y2="722" stroke="#dce6ed" stroke-width="2"/>
<text x="52" y="751" font-size="17" fill="#5f7385" font-weight="400">Учебная иллюстрация • условные данные • не снимок вашего аккаунта</text>
<rect x="52" y="207" width="570" height="332" rx="14" fill="#f6f9fc" stroke="#dce7ef"/>
<text x="76" y="250" font-size="24" fill="#167fc5" font-weight="700" class="mono">send_saved_text</text>
<text x="76" y="300" font-size="20" fill="#213b51" font-weight="400">text: Тест подключения</text>
<text x="76" y="343" font-size="20" fill="#213b51" font-weight="400">request_id: dot-saved-demo-001</text>
<text x="76" y="386" font-size="20" fill="#213b51" font-weight="400">Получатель: собственное «Избранное»</text>
<rect x="76" y="455" width="330" height="48" rx="10" fill="#167fc5" stroke="none"/>
<text x="93" y="486" font-size="19" fill="#ffffff" font-weight="700">Подтверждение владельца</text>
<rect x="650" y="207" width="498" height="332" rx="14" fill="#ecf8f1" stroke="#cae7d7"/>
<text x="674" y="250" font-size="25" fill="#247d5e" font-weight="700">Пример квитанции</text>
<text x="674" y="302" font-size="19" fill="#213b51" font-weight="400" class="mono">destination: saved_messages</text>
<text x="674" y="349" font-size="19" fill="#213b51" font-weight="400" class="mono">status: delivered_verified</text>
<text x="674" y="396" font-size="19" fill="#213b51" font-weight="400" class="mono">readback_verified: true</text>
<text x="674" y="443" font-size="19" fill="#213b51" font-weight="400" class="mono">message_id: 101  (пример)</text>
<rect x="52" y="573" width="1096" height="84" rx="14" fill="#fff6df" stroke="none"/>
<text x="70" y="602" font-size="18" fill="#8a650b" font-weight="400">uncertain_do_not_retry → сначала осмотр результата.</text>
<text x="70" y="630" font-size="18" fill="#8a650b" font-weight="400">Не создавайте новый request_id ради повтора: сообщение уже могло отправиться.</text>
</svg>
