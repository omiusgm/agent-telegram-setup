<text x="510" y="560" font-size="15" fill="#5f7385" font-weight="400">Вход подтверждён</text>
<rect x="718" y="451" width="208" height="133" rx="14" fill="#f6f9fc" stroke="none"/>
<rect x="732" y="465" width="43" height="34" rx="17" fill="#eaf4fc" stroke="none"/>
