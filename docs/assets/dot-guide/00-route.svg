<text x="732" y="560" font-size="15" fill="#5f7385" font-weight="400">Установлен</text>
<rect x="940" y="451" width="208" height="133" rx="14" fill="#f6f9fc" stroke="none"/>
<rect x="954" y="465" width="43" height="34" rx="17" fill="#eaf4fc" stroke="none"/>
<text x="968" y="488" font-size="15" fill="#167fc5" font-weight="700">5</text>
<text x="954" y="532" font-size="22" fill="#213b51" font-weight="700">Вызов Dot</text>
<text x="954" y="560" font-size="15" fill="#5f7385" font-weight="400">Получен ответ</text>
<rect x="52" y="619" width="1096" height="56" rx="14" fill="#edf6fc" stroke="none"/>
<text x="70" y="648" font-size="18" fill="#167fc5" font-weight="400">Отправка включается отдельным правом. Первый тест записи — только собственное «Избранное».</text>
